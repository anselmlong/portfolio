<style>
  :root{
    --paper:#e7dcc4; --paper2:#f0e7d3; --panel:#efe6d1;
    --ink:#231f18; --ink2:#6d6350; --hair:#cbbb98;
    --seal:#a52a1a; --seal2:#8f2415; --gold:#96792f;
    --m:#3f6b7d; --f:#9a5b6e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased; touch-action:none;
  }
  .sans{font-family:ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif;}

  /* ---------- top bar ---------- */
  #bar{
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background:rgba(231,220,196,.94); backdrop-filter:blur(9px);
    border-bottom:1px solid var(--hair);
  }
  #brand{display:flex; align-items:center; gap:9px; flex:0 0 auto;}
  #seal{width:30px; height:30px; border-radius:4px; background:var(--seal);
    display:grid; place-items:center; color:#f2ead8; font-size:19px; flex:0 0 auto;
    font-family:'Noto Serif CJK SC','Songti SC',serif; transform:rotate(-3deg);}
  #brandtxt{line-height:1.15;}
  #brandtxt b{font-size:14px; font-weight:600; display:block; letter-spacing:-.01em;}
  #brandtxt span{font-size:10px; color:var(--ink2); letter-spacing:.12em; text-transform:uppercase;}
  #tools{display:flex; align-items:center; gap:7px; margin-left:auto; flex-wrap:nowrap;}
  #searchwrap{position:relative;}
  #q{width:180px; padding:7px 26px 7px 28px; border:1px solid var(--hair);
    background:var(--paper2); border-radius:7px; font-size:13px; color:var(--ink);
    font-family:inherit;}
  #q:focus{outline:2px solid var(--seal); outline-offset:1px;}
  #qi{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink2); pointer-events:none;}
  #qx{position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:0; background:none; color:var(--ink2); cursor:pointer; font-size:14px; display:none;}
  .btn{font-family:ui-sans-serif,system-ui,sans-serif; font-size:11.5px; font-weight:600;
    padding:8px 11px; border:1px solid var(--hair); background:var(--paper2);
    color:var(--ink); border-radius:7px; cursor:pointer; white-space:nowrap;}
  .btn:hover{border-color:var(--ink2);}
  .btn.on{background:var(--seal); border-color:var(--seal2); color:#f7f1e2;}
  .btn.dark{background:var(--ink); border-color:var(--ink); color:var(--paper2);}

  /* ---------- canvas ---------- */
  #stage{position:fixed; inset:0; top:0; cursor:grab;}
  #stage.drag{cursor:grabbing;}
  svg{width:100%; height:100%; display:block;}
  .link{fill:none; stroke:#bda97f; stroke-width:1.5;}
  .link.online{stroke:var(--seal); stroke-width:2.4;}
  .link.dim{opacity:.13;}

  .node{cursor:pointer;}
  .card{fill:var(--paper2); stroke:var(--hair); stroke-width:1.5; rx:9;}
  .node.line .card{fill:#f6eeda; stroke:var(--seal); stroke-width:2.2;}
  .node.me .card{fill:#fdf6e4; stroke:var(--seal); stroke-width:3;}
  .node:hover .card{stroke:var(--ink2);}
  .node.line:hover .card{stroke:var(--seal2);}
  .node.sel .card{stroke:var(--gold); stroke-width:3;}
  .node.hit .card{fill:#f5e9c6; stroke:var(--gold); stroke-width:2.5;}
  .node.dim{opacity:.14;}

  .nm{font-size:13.5px; font-weight:600; fill:var(--ink);}
  .node.line .nm{fill:var(--seal2);}
  .al{font-size:11px; font-style:italic; fill:var(--gold);}
  .dt{font-size:9.5px; fill:var(--ink2); font-family:ui-monospace,Menlo,monospace;}
  .av{stroke:var(--hair); stroke-width:1.4;}
  .node.line .av{stroke:var(--seal);}
  .mono{font-size:13px; font-weight:600; text-anchor:middle;}
  .kid{font-size:9px; font-weight:700; fill:#f2ead8; font-family:ui-sans-serif,sans-serif;}
  .toggle{cursor:pointer;}

  /* ---------- detail panel ---------- */
  #panel{
    position:fixed; z-index:40; background:var(--paper2);
    border:1px solid var(--hair); border-radius:13px;
    box-shadow:0 14px 40px rgba(35,31,24,.24);
    padding:17px 18px 18px; overflow-y:auto; display:none;
  }
  @media(min-width:721px){ #panel{ right:14px; top:64px; width:335px; max-height:calc(100vh - 82px);} }
  @media(max-width:720px){ #panel{ left:0; right:0; bottom:0; max-height:64vh;
    border-radius:15px 15px 0 0; border-bottom:0;} }
  #pclose{position:absolute; top:11px; right:12px; border:0; background:none;
    font-size:19px; color:var(--ink2); cursor:pointer; line-height:1; padding:3px;}
  #pgen{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--seal); font-weight:700;}
  #pname{font-size:22px; font-weight:600; margin:5px 0 0; line-height:1.15; padding-right:22px;}
  #palias{font-size:14px; font-style:italic; color:var(--gold); margin-top:2px;}
  .prow{display:flex; gap:9px; font-size:12.5px; margin-top:9px; line-height:1.45;}
  .pk{flex:0 0 74px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink2); font-family:ui-sans-serif,sans-serif; font-weight:700; padding-top:2px;}
  .pv{flex:1;}
  #pnote{font-size:12.5px; font-style:italic; color:var(--ink2); line-height:1.6;
    margin-top:13px; padding-top:11px; border-top:1px solid var(--hair);}
  #ppath{margin-top:12px; padding-top:11px; border-top:1px solid var(--hair);
    font-size:11px; color:var(--ink2); line-height:1.7;}
  #ppath b{color:var(--seal2);}
  #pphoto{width:100%; border-radius:9px; margin-top:12px; display:none; border:1px solid var(--hair);}
  #pcredit{font-size:9.5px; color:var(--ink2); margin-top:5px; display:none; line-height:1.4;}

  /* ---------- zoom + legend ---------- */
  #zoom{position:fixed; right:14px; bottom:14px; z-index:25; display:flex; flex-direction:column; gap:6px;}
  #zoom button{width:38px; height:38px; border-radius:9px; border:1px solid var(--hair);
    background:rgba(240,231,211,.95); color:var(--ink); font-size:17px; cursor:pointer;
    display:grid; place-items:center; font-family:ui-sans-serif,sans-serif;}
  #zoom button:hover{border-color:var(--ink2);}
  #legend{position:fixed; left:12px; bottom:12px; z-index:25; font-size:10px;
    color:var(--ink2); background:rgba(240,231,211,.9); border:1px solid var(--hair);
    border-radius:8px; padding:7px 10px; line-height:1.8; font-family:ui-sans-serif,sans-serif;}
  #legend b{color:var(--seal);}
  @media(max-width:720px){
    #legend{display:none;}
    #q{width:120px;}
    #brandtxt span{display:none;}
    .btn{padding:8px 9px; font-size:11px;}
  }
  /* Below ~600px, brand + search + 3 buttons no longer fit in one row —
     wrap onto a second line instead of letting buttons run off-screen. */
  @media(max-width:600px){
    #bar{flex-wrap:wrap; row-gap:8px;}
    #brand{flex:1 1 auto;}
    #tools{width:100%; flex-wrap:wrap;}
    #searchwrap{flex:1 1 auto;}
    #q{width:100%;}
  }
  #hint{position:fixed; left:50%; top:58px; transform:translateX(-50%); z-index:26;
    background:rgba(35,31,24,.86); color:#f2ead8; font-size:11.5px; padding:7px 14px;
    border-radius:20px; font-family:ui-sans-serif,sans-serif; pointer-events:none;
    transition:opacity .6s; }

/* ================================================================= */
const NW=172, NH=64, GAPX=16, GAPY=112;
const GENNAME=["First","Second","Third","Fourth","Fifth","Sixth"];
const GENCN=["第一代","第二代","第三代","第四代","第五代","第六代"];

const view=document.getElementById('view');
const svg=document.getElementById('svg');
const stage=document.getElementById('stage');

let ALL=[], byId={}, lineIds=[];

/* ---- prepare ---- */
(function prep(){
  let i=0;
  (function walk(nd,depth,parent){
    nd.id='n'+(i++); nd.depth=depth; nd.parent=parent;
    nd.open = false;
    byId[nd.id]=nd; ALL.push(nd);
    nd.desc=0;
    if(nd.k) nd.k.forEach(c=>{ walk(c,depth+1,nd); nd.desc += 1 + c.desc; });
    if(nd.line) lineIds.push(nd.id);
    nd.q=[nd.n,nd.a,nd.l,nd.sp,nd.note].filter(Boolean).join(' ').toLowerCase();
  })(DATA,0,null);
  // open the direct line by default
  ALL.forEach(n=>{ if(n.line && n.k) n.open=true; });
  DATA.open=true;
})();

function onLine(nd){ // is this node an ancestor-or-self of the line?
  let p=nd; while(p){ if(p.line) return true; p=p.parent; }
  return false;
}
function isLineNode(nd){
  if(nd.line) return true;
  // a node is "on the path" if any descendant is on the line
  let found=false;
  (function w(x){ if(found) return; if(x.line){found=true;return;} if(x.k) x.k.forEach(w); })(nd);
  return found;
}
ALL.forEach(n=>{ n.path = isLineNode(n); });

/* ---- layout ---- */
let nodes=[], links=[], bounds={}, lineBounds={};
function boundsOf(list){
  const xs=list.map(n=>n.X), ys=list.map(n=>n.Y);
  return {x0:Math.min(...xs)-40, x1:Math.max(...xs)+NW+40,
          y0:Math.min(...ys)-40, y1:Math.max(...ys)+NH+40};
}
function layout(){
  nodes=[]; links=[];
  let cursor=0;
  (function place(nd){
    const kids = (nd.open && nd.k) ? nd.k : [];
    if(!kids.length){
      nd.X = cursor; cursor += NW+GAPX;
    } else {
      kids.forEach(place);
      nd.X = (kids[0].X + kids[kids.length-1].X)/2;
    }
    nd.Y = nd.depth*(NH+GAPY);
    nodes.push(nd);
    kids.forEach(c=>links.push({a:nd,b:c}));
  })(DATA);

  bounds=boundsOf(nodes);
  // Separate bounds covering only the line-of-descent nodes, so "Fit" while
  // "Trace the line" is active frames the line itself, not the whole tree
  // (the root's other ~24 children are still `open`, just dimmed).
  const pathNodes=nodes.filter(n=>n.path);
  lineBounds=pathNodes.length?boundsOf(pathNodes):bounds;
}

/* ---- pan / zoom ---- */
let T={x:0,y:0,k:1};
function apply(){ view.setAttribute('transform',`translate(${T.x},${T.y}) scale(${T.k})`); }
function barHeight(){ return document.getElementById('bar').offsetHeight; }
function fit(animate){
  const barH=barHeight();
  const w=innerWidth, h=innerHeight-barH;
  const b=focusLine?lineBounds:bounds;
  const bw=b.x1-b.x0, bh=b.y1-b.y0;
  const k=Math.min(w/bw, h/bh, 1.05);
  const target={k:k, x:(w-bw*k)/2 - b.x0*k, y:barH+(h-bh*k)/2 - b.y0*k};
  animate? glide(target) : (T=target, apply());
}
function centerOn(nd,kk){
  const barH=barHeight();
  const k=kk||Math.max(T.k,.72);
  glide({k:k, x:innerWidth/2-(nd.X+NW/2)*k, y:barH+(innerHeight-barH)/2-(nd.Y+NH/2)*k});
}
function glide(to){
  const from={...T}, t0=performance.now(), dur=430;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    T={x:from.x+(to.x-from.x)*e, y:from.y+(to.y-from.y)*e, k:from.k+(to.k-from.k)*e};
    apply(); if(p<1) requestAnimationFrame(step);
  })(t0);
}

function zoomAt(cx,cy,f){
  const nk=Math.min(2.4,Math.max(.02,T.k*f));
  const r=nk/T.k;
  T.x=cx-(cx-T.x)*r; T.y=cy-(cy-T.y)*r; T.k=nk; apply();
}

/* ---- unified pointer handling: pan with one finger, pinch-zoom with two.
   A single pointer map avoids the drag/pinch state stepping on each other
   mid-gesture, which is what caused the jump on touch devices. ---- */
let pts=new Map(), drag=null, pinchD=0;

function pinchDist(){
  const [a,b]=[...pts.values()];
  return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
}
function startPan(e){
  drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};
  stage.classList.add('drag');
}
stage.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,e);
  // Only capture (and treat as pan-eligible) when the tap didn't start on a
  // card — capturing unconditionally redirects the browser's synthesized
  // 'click' target to #stage on touch devices, which silently breaks
  // tap-to-open-detail on every node.
  if(!e.target.closest('.node')) stage.setPointerCapture(e.pointerId);
  if(pts.size===2){
    drag=null; stage.classList.remove('drag');
    pinchD=pinchDist();
  } else if(pts.size===1 && !e.target.closest('.node')){
    startPan(e);
  }
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId,e);
  if(pts.size===2){
    const d=pinchDist();
    const [a,b]=[...pts.values()];
    if(pinchD) zoomAt((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2, d/pinchD);
    pinchD=d;
  } else if(drag){
    T.x=drag.tx+(e.clientX-drag.x); T.y=drag.ty+(e.clientY-drag.y); apply();
  }
});
['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,e=>{
  pts.delete(e.pointerId);
  drag=null; stage.classList.remove('drag'); pinchD=0;
  if(pts.size===1) startPan([...pts.values()][0]); // resume panning with the remaining finger
}));

stage.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0016);
  zoomAt(e.clientX,e.clientY,f);
},{passive:false});

/* iOS Safari fires its own gesture events for two-finger pinch on top of
   (sometimes instead of) pointer events; without this the page can zoom
   natively while our own pinch-zoom is also running. */
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));

document.getElementById('zin').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.32);
document.getElementById('zout').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1/1.32);
document.getElementById('bfit').onclick=()=>{layout();render();fit(true);};

/* ---- render ---- */
let focusLine=false, query='', hits=new Set(), selId=null;
const NS='http://www.w3.org/2000/svg';
function el(t,at){const e=document.createElementNS(NS,t); for(const k in at) e.setAttribute(k,at[k]); return e;}

function render(){
  view.textContent='';
  const gl=el('g'),gn=el('g');
  view.append(gl,gn);

  links.forEach(L=>{
    const x1=L.a.X+NW/2, y1=L.a.Y+NH, x2=L.b.X+NW/2, y2=L.b.Y;
    const my=y1+(y2-y1)/2;
    const p=el('path',{d:`M${x1},${y1} V${my} H${x2} V${y2}`,class:'link'});
    if(L.a.path&&L.b.path) p.classList.add('online');
    if(focusLine&&!(L.a.path&&L.b.path)) p.classList.add('dim');
    gl.append(p);
  });

  nodes.forEach(nd=>{
    const g=el('g',{class:'node',transform:`translate(${nd.X},${nd.Y})`});
    if(nd.line) g.classList.add('line');
    if(nd.me) g.classList.add('me');
    if(nd.id===selId) g.classList.add('sel');
    if(query&&hits.has(nd.id)) g.classList.add('hit');
    if(focusLine&&!nd.path) g.classList.add('dim');
    if(query&&!hits.has(nd.id)) g.classList.add('dim');

    g.append(el('rect',{class:'card',width:NW,height:NH,rx:9}));

    // avatar: photo for Kapitan only, else monogram
    const ph=PHOTOS[nd.n];
    const cx=25,cy=NH/2,r=16;
    if(ph){
      const cid='clip'+nd.id;
      const cp=el('clipPath',{id:cid}); cp.append(el('circle',{cx,cy,r}));
      g.append(cp);
      const im=el('image',{x:cx-r,y:cy-r,width:r*2,height:r*2,'clip-path':`url(#${cid})`,
        preserveAspectRatio:'xMidYMid slice'});
      im.setAttributeNS('http://www.w3.org/1999/xlink','href',ph.src);
      im.setAttribute('href',ph.src);
      im.addEventListener('error',()=>{im.remove(); g.append(mono(nd,cx,cy,r));});
      g.append(el('circle',{cx,cy,r,fill:'#ded0b0'}));
      g.append(im);
      g.append(el('circle',{cx,cy,r,class:'av',fill:'none'}));
    } else {
      g.append(mono(nd,cx,cy,r));
    }

    const nx=50;
    let ty= nd.a? 26 : 31;
    const nm=el('text',{x:nx,y:ty,class:'nm'});
    nm.textContent=(nd.line?'✦ ':'')+trunc(nd.n,17)+(nd.x?' †':'');
    g.append(nm);
    if(nd.a){ const al=el('text',{x:nx,y:40,class:'al'}); al.textContent=trunc(nd.a,20); g.append(al); }
    const bits=[];
    if(nd.o) bits.push('#'+nd.o+' son');
    if(nd.dau) bits.push('daughter');
    if(nd.b||nd.d) bits.push((nd.b||'?')+'–'+(nd.d||(nd.x?'?':'')));
    if(nd.l&&!nd.b&&!nd.o) bits.push(nd.l);
    if(nd.ad) bits.push('adopted');
    if(bits.length){ const dt=el('text',{x:nx,y:nd.a?54:46,class:'dt'}); dt.textContent=trunc(bits.join(' · '),24); g.append(dt); }

    if(nd.k&&nd.k.length){
      const bg=el('g',{class:'toggle',transform:`translate(${NW/2-13},${NH-1})`});
      bg.append(el('rect',{x:-7,y:-8,width:40,height:32,fill:'transparent'})); // larger invisible hit area for touch
      bg.append(el('rect',{width:26,height:16,rx:8,fill:nd.open?'#8a7c5c':(nd.path?'#a52a1a':'#6d6350')}));
      const t=el('text',{x:13,y:11.5,class:'kid','text-anchor':'middle'});
      t.textContent = nd.open? '–' : (1+nd.desc>99?'99+':nd.n===DATA.n?nd.k.length:1+nd.desc);
      bg.append(t); g.append(bg);
      bg.addEventListener('click',ev=>{ev.stopPropagation(); toggle(nd);});
    }
    g.addEventListener('click',()=>showPanel(nd));
    gn.append(g);
  });
}
function mono(nd,cx,cy,r){
  const g=el('g');
  g.append(el('circle',{cx,cy,r,fill:nd.s==='f'?'#e4d3d8':'#d5e0e5',class:'av'}));
  const t=el('text',{x:cx,y:cy+4.5,class:'mono',fill:nd.s==='f'?'#9a5b6e':'#3f6b7d'});
  t.textContent=initials(nd.n); g.append(t); return g;
}
function initials(n){
  const p=n.replace(/[()']/g,'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p.length>2? p[1][0]+p[2][0] : p.map(w=>w[0]).join('')).toUpperCase().slice(0,2);
}
function trunc(s,n){ return s.length>n? s.slice(0,n-1)+'…' : s; }

function toggle(nd){
  nd.open=!nd.open;
  const bx=nd.X, by=nd.Y;
  layout(); render();
  T.x += (bx-nd.X)*T.k; T.y += (by-nd.Y)*T.k; apply();
}

/* ---- panel ---- */
const panel=document.getElementById('panel');
document.getElementById('pclose').onclick=()=>{panel.style.display='none'; selId=null; render();};
function showPanel(nd){
  selId=nd.id; render();
  const gi=Math.min(nd.depth,5);
  document.getElementById('pgen').textContent=`${GENCN[gi]} · ${GENNAME[gi]} generation`;
  document.getElementById('pname').textContent=nd.n+(nd.x?' †':'');
  const al=document.getElementById('palias');
  al.textContent=nd.a||''; al.style.display=nd.a?'block':'none';

  const ph=PHOTOS[nd.n], img=document.getElementById('pphoto'), cr=document.getElementById('pcredit');
  if(ph){ img.src=ph.src; img.style.display='block'; cr.textContent=ph.credit; cr.style.display='block';
    img.onerror=()=>{img.style.display='none'; cr.style.display='none';};
  } else { img.style.display='none'; cr.style.display='none'; }

  const rows=[];
  if(nd.title) rows.push(['Office',nd.title]);
  if(nd.o) rows.push(['Rank','Son no. '+nd.o+' of 15']);
  if(nd.dau) rows.push(['Rank','Daughter of the Kapitan']);
  if(nd.b||nd.d) rows.push(['Dates',(nd.b||'?')+' – '+(nd.d||(nd.x?'?':'living'))]);
  if(nd.sp) rows.push(['Married',nd.sp]);
  if(nd.via) rows.push(['Born to',nd.via]);
  if(nd.l) rows.push(['Location',nd.l]);
  if(nd.ad) rows.push(['Note','Adopted']);
  if(nd.k) rows.push(['Children',nd.k.length+' recorded · '+nd.desc+' descendants in total']);
  document.getElementById('pmeta').innerHTML=rows.map(r=>
    `<div class="prow"><div class="pk">${r[0]}</div><div class="pv">${esc(r[1])}</div></div>`).join('');

  const nt=document.getElementById('pnote');
  nt.textContent=nd.note||''; nt.style.display=nd.note?'block':'none';

  const chain=[]; let p=nd; while(p){chain.unshift(p); p=p.parent;}
  document.getElementById('ppath').innerHTML='<b>Line of descent</b><br>'+
    chain.map(c=>c===nd?`<b>${esc(c.n)}</b>`:esc(c.n)).join(' &rsaquo; ');

  panel.style.display='block'; panel.scrollTop=0;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---- search ---- */
const qEl=document.getElementById('q'), qx=document.getElementById('qx');
let searchOpened=new Set(); // branches opened only to reveal a search hit — closed again when the search clears
qEl.addEventListener('input',()=>{
  query=qEl.value.trim().toLowerCase();
  qx.style.display=query?'block':'none';
  hits=new Set();
  if(query){
    ALL.forEach(n=>{ if(n.q.includes(query)) hits.add(n.id); });
    // open ancestors of every hit, remembering which ones we opened
    hits.forEach(id=>{ let p=byId[id].parent; while(p){ if(!p.open){p.open=true; searchOpened.add(p.id);} p=p.parent; } });
    layout(); render();
    const first=ALL.find(n=>hits.has(n.id));
    if(first) centerOn(first,Math.max(T.k,.62));
  } else {
    // clearing the search: fold back up whatever it opened, leaving the tree as it was before
    searchOpened.forEach(id=>{ const n=byId[id]; if(n) n.open=false; });
    searchOpened.clear();
    layout(); render();
  }
});
qx.onclick=()=>{qEl.value=''; qEl.dispatchEvent(new Event('input')); qEl.focus();};

/* ---- modes ---- */
const bline=document.getElementById('bline');
bline.onclick=()=>{
  focusLine=!focusLine; bline.classList.toggle('on',focusLine);
  bline.textContent=focusLine?'Showing the line':'Trace the line';
  if(focusLine){ ALL.forEach(n=>{ if(n.path&&n.k) n.open=true; }); layout(); }
  render();
  if(focusLine){ const me=ALL.find(n=>n.me); if(me) centerOn(me,.85); }
};
let allOpen=false;
const bexp=document.getElementById('bexp');
bexp.onclick=()=>{
  allOpen=!allOpen;
  ALL.forEach(n=>{ if(n.k) n.open=allOpen; });
  if(!allOpen){ DATA.open=true; ALL.forEach(n=>{ if(n.line&&n.k) n.open=true; }); }
  bexp.textContent=allOpen?'Collapse':'Expand all';
  layout(); render(); fit(true);
};

/* ---- go: open zoomed in on Anselm's own line, not the whole tree ---- */
layout(); render();
focusLine=true;
bline.classList.add('on');
bline.textContent='Showing the line';
render();
const me=ALL.find(n=>n.me);
if(me) centerOn(me, innerWidth<480 ? 1 : .85);
else fit(false);

/* Re-fit only on a real width change (resize/rotation) — a phone's
   address bar showing/hiding while scrolling fires `resize` constantly
   with only the height changing, and re-fitting every time would yank
   the view back out from under whatever the user just panned/zoomed to. */
let lastW=innerWidth, resizeT=null;
function onResize(){
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{
    const widthChanged=Math.abs(innerWidth-lastW)>80;
    lastW=innerWidth;
    layout(); render();
    if(widthChanged) fit(false);
  },120);
}
addEventListener('resize',onResize);
if(window.visualViewport) visualViewport.addEventListener('resize',onResize);
setTimeout(()=>{const h=document.getElementById('hint'); h.style.opacity=0;},4200);
</script>
